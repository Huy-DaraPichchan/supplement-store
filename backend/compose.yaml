name: supplement-store-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_BACKEND: sqlite
      SQLITE_PATH: /data/ecommerce.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      RUN_MIGRATIONS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  api_data:
