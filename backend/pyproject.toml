[project]
name = "iherb-clone-api"
version = "0.1.0"
description = "A streamlined supplement catalog and chat-order API"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.14.0",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "supabase>=2.11.0",
    "fastapi-cloud-cli>=0.26.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
